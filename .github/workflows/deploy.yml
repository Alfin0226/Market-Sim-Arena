name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Neon Database Connection String
        env:
          NEON_DB_URL: ${{ secrets.NEON_DB_URL }}
        run: |
          node -e "
            const fs = require('fs');
            let html = fs.readFileSync('index.html', 'utf8');
            html = html.replace('const NEON_DB_URL = \"\";', 'const NEON_DB_URL = \"' + (process.env.NEON_DB_URL || '') + '\";');
            fs.writeFileSync('index.html', html, 'utf8');
          "

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages
